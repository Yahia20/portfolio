headline:
  en: I turn your company's data and customer calls into clear decisions.
  ar: أحوّل بيانات شركتك ومكالمات عملائك إلى قرارات واضحة.

intro:
  en: >-
    Most companies already have the answers they need — buried in thousands of calls, chats and
    spreadsheets that nobody has time to go through. I build the systems that go through them:
    they transcribe, read, analyse and forecast, then hand a person a short, clear report they can
    act on the same day.
  ar: >-
    معظم الشركات تملك الإجابات التي تحتاجها بالفعل، لكنها مدفونة في آلاف المكالمات والمحادثات
    والجداول التي لا يجد أحد وقتًا لمراجعتها. أنا أبني الأنظمة التي تراجعها: تفرّغ وتقرأ وتحلّل
    وتتوقّع، ثم تسلّم الشخص المسؤول تقريرًا قصيرًا واضحًا يستطيع أن يتصرف بناءً عليه في نفس اليوم.

about:
  - en: >-
      I'm an AI engineer based in Cairo. Since November 2025 I've worked with Travel Gate, a travel
      agency in Saudi Arabia, where I built the system that now transcribes and reviews every
      customer call and chat — work that used to depend on a supervisor listening to a few calls
      at random.
    ar: >-
      أنا مهندس ذكاء اصطناعي من القاهرة. منذ نوفمبر 2025 أعمل مع ترافل جيت، وكالة سفر في
      السعودية، حيث بنيت النظام الذي يفرّغ ويراجع الآن كل مكالمة ومحادثة مع العملاء — وهو عمل
      كان يعتمد على مشرف يستمع لعدد قليل من المكالمات يختارها عشوائيًا.
  - en: >-
      Before that I trained for 540 hours in AI and data engineering at Egypt's National
      Telecommunication Institute, and studied Information Systems at Fayoum University's
      Faculty of Computers & AI.
    ar: >-
      قبل ذلك تدرّبت 540 ساعة في الذكاء الاصطناعي وهندسة البيانات في المعهد القومي
      للاتصالات، ودرست نظم المعلومات في كلية الحاسبات والذكاء الاصطناعي بجامعة الفيوم.
  - en: >-
      I care about AI that ships and pays for itself. That means being honest about what a model
      can't do, checking its work against a person's, and explaining the result in plain words
      to the people who have to use it.
    ar: >-
      يهمني الذكاء الاصطناعي الذي يُستخدم فعلًا ويغطي تكلفته. وهذا يعني أن أكون صريحًا فيما لا
      يستطيع النموذج فعله، وأن أراجع عمله مقارنة بعمل إنسان، وأن أشرح النتيجة بكلمات بسيطة لمن
      سيستخدمها.

services:
  - icon: waveform
    title: { en: "Call & chat quality review", ar: "مراجعة جودة المكالمات والمحادثات" }
    body:
      en: Every conversation transcribed and scored against your own checklist, with the evidence quoted.
      ar: كل محادثة تُفرَّغ وتُقيَّم حسب معاييرك أنت، مع اقتباس الدليل.
  - icon: chat
    title: { en: "Assistants that know your business", ar: "مساعد ذكي يعرف شركتك" }
    body:
      en: A chatbot that answers from your policies and documents, and hands over to a person when it isn't sure.
      ar: روبوت محادثة يجيب من سياساتك ومستنداتك، ويحوّل لموظف عندما لا يكون متأكدًا.
  - icon: chart
    title: { en: "Dashboards & forecasts", ar: "لوحات متابعة وتوقعات" }
    body:
      en: Clean numbers, clear dashboards and demand forecasts your management can decide on.
      ar: أرقام نظيفة ولوحات واضحة وتوقعات للطلب تستطيع إدارتك أن تتخذ قرارها بناءً عليها.
  - icon: check
    title: { en: "Choosing the right AI model", ar: "اختيار نموذج الذكاء الاصطناعي المناسب" }
    body:
      en: A fair test of which model does your task best and what it will cost you each month.
      ar: اختبار عادل لأي نموذج يؤدي مهمتك بأفضل شكل، وكم سيكلفك شهريًا.

