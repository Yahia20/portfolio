# Written for a non-technical reader. Technical detail lives only under `tech`.

slug: ask-your-data
category: data-analysis
status: completed
featured: false
order: 1
date: 2026-10

title:
  en: Ask your business data a question in Arabic — and trust the number
  ar: اسأل بيانات شركتك بالعربي — وثِق في الرقم
tagline:
  en: A data assistant for managers — ask in Saudi dialect or formal Arabic, get the number, the chart and the query behind it, and a question back when yours is unclear.
  ar: مساعد بيانات للمدراء — اسأل باللهجة السعودية أو بالفصحى، واحصل على الرقم والرسم والاستعلام الذي خلفه، وسؤال توضيحي عندما يكون سؤالك غير واضح.

role:
  en: Designed and built it end to end — the business definitions, the assistant, a 200-question Arabic exam, and a check against a production database schema.
  ar: صمّمته وبنيته بالكامل — تعريفات العمل، والمساعد، واختبار من 200 سؤال عربي، والتحقق على هيكل قاعدة بيانات حقيقية.

