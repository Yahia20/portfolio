# Written for a non-technical reader. Technical detail lives only under `tech`.

slug: document-reader
category: document-ai
status: completed
featured: false
order: 1
date: 2026-10

title:
  en: Read IDs and invoices from a photo, and know which fields to trust
  ar: اقرأ الهويات والفواتير من صورة، واعرف أي البيانات تثق بها
tagline:
  en: "I built a reader for passports, ID cards, visas, ZATCA tax invoices and boarding passes. It checks every field before it reaches your system."
  ar: "بنيت قارئًا لجوازات السفر وبطاقات الهوية والتأشيرات وفواتير هيئة الزكاة وبطاقات صعود الطائرة، يتحقق من كل معلومة قبل أن تصل إلى نظامك."

role:
  en: I built the whole project, from the document reader to the 600-document test and the real-photo benchmark.
  ar: بنيت المشروع بالكامل، من القارئ نفسه حتى اختبار الـ 600 مستند واختبار الصور الحقيقية.

