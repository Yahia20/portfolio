  image: cover.png
  alt:
    en: "Summary: 37% of bookings cancelled, worth €16.7M; a deposit for risky bookings earns €399k, a deposit for everyone loses €199k"
    ar: "الخلاصة: 37% من الحجوزات أُلغيت بقيمة 16.7 مليون يورو؛ العربون للحجوزات الخطرة يربح 399 ألف يورو، والعربون للجميع يخسر 199 ألف يورو"

