# Written for a non-technical reader. Technical detail lives only under `tech`.

slug: hotel-cancellation-analytics
category: data-analysis
status: completed
featured: false
order: 2
date: 2026-10

title:
  en: Stop losing money to hotel cancellations
  ar: أوقف خسارة الأموال بسبب إلغاء حجوزات الفنادق
tagline:
  en: "I analysed 119,000 hotel bookings to find out what cancellations cost, who cancels, and what the hotel should do about it."
  ar: "حلّلت 119 ألف حجز فندقي لأعرف كم تكلّف الإلغاءات، ومن الذي يلغي، وماذا يجب أن يفعل الفندق."

role:
  en: I built the whole project, from the raw data to the recommendation and the dashboard.
  ar: بنيت المشروع بالكامل، من البيانات الخام حتى التوصية ولوحة المتابعة.

