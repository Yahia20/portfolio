# the examples table from data/demos/support-assistant (scripts/export_portfolio.py there).

slug: support-assistant
category: ai-assistants
status: completed
featured: false
order: 1
date: 2026-10

title:
  en: A support assistant that answers in Saudi dialect — and knows when to hand over
  ar: مساعد خدمة عملاء يرد باللهجة السعودية — ويعرف متى يحوّل لموظف
short_title: { en: "Saudi support assistant", ar: "مساعد خدمة العملاء" }
tagline:
  en: "Customers ask about fees, refunds, baggage, visas and Umrah in Saudi dialect, formal Arabic or English. It answers only from your written policy, code checks every answer, and anything it can't prove goes to a person."
  ar: "يسأل العملاء عن الرسوم والاسترداد والأمتعة والتأشيرات والعمرة باللهجة السعودية أو الفصحى أو الإنجليزية. يجيب فقط من سياستك المكتوبة، والكود يراجع كل إجابة، وكل ما لا يستطيع إثباته يذهب لموظف."

role:
  en: I built it end to end — the policy book, the assistant, the checks, and a 245-message test written before the code.
  ar: بنيته بالكامل — كتاب السياسات، والمساعد، والفحوصات، واختبار من 245 رسالة كُتب قبل الكود.

cover:
  image: cover.png
  alt:
    en: "A customer asks in Saudi dialect about the Saver change fee and gets SAR 250, verified against the policy; a compensation request goes to a person"
    ar: "عميل يسأل باللهجة السعودية عن رسوم تغيير تذكرة التوفير فيحصل على 250 ريال مُتحقق منها من السياسة؛ وطلب تعويض يُحوَّل لموظف"

stats:
  - display: { en: "0", ar: "0" }
    label: { en: "wrong answers sent to customers", ar: "إجابات خاطئة وصلت للعملاء" }
    note: { en: "163 answers sent on 245 test messages", ar: "من 163 إجابة على 245 رسالة اختبار" }
  - display: { en: "68 / 68", ar: "68 / 68" }
    label: { en: "messages that needed a person were handed over", ar: "رسالة تحتاج موظفًا حُوّلت له" }
  - display: { en: "98.8%", ar: "98.8%" }
    label: { en: "of policy questions answered correctly with no person", ar: "من أسئلة السياسة أُجيبت صحيحًا دون موظف" }
  - display: { en: "$0.17", ar: "0.17 دولار" }
    label: { en: "per 1,000 conversations", ar: "لكل 1,000 محادثة" }
