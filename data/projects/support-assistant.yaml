problem:
  title: { en: "The problem", ar: "المشكلة" }
  body:
    en: >-
      Most customer questions to a travel agency have a written answer: how much to change a
      Saver ticket, when a refund arrives, how many bags a child gets. The team answers them by
      hand, again and again, in WhatsApp and on the phone. A chatbot looks like the fix, but a
      chatbot that makes up a refund deadline or promises compensation costs more than it saves.
      The real requirement is an assistant that answers only what the policy says, in the way
      Saudi customers actually write, and hands everything else to a person.
    ar: >-
      معظم أسئلة العملاء لوكالة السفر لها إجابة مكتوبة: كم رسوم تغيير تذكرة التوفير، متى يرجع المبلغ،
      كم حقيبة للطفل. والفريق يجيب عنها يدويًا مرة بعد مرة على الواتساب والهاتف. روبوت المحادثة يبدو
      حلًا، لكن الروبوت الذي يخترع موعد استرداد أو يعد بتعويض يكلّف أكثر مما يوفّر. المطلوب فعلًا مساعد
      يجيب فقط بما تقوله السياسة، وبالطريقة التي يكتب بها العملاء السعوديون فعلًا، ويحوّل كل ما عدا ذلك لموظف.

steps:
  - icon: search
    title: { en: "Find the rule", ar: "إيجاد القاعدة" }
    body:
      en: "Each message is matched to the closest sections of the company policy, in Arabic or English."
      ar: "كل رسالة تُطابَق مع أقرب أقسام سياسة الشركة، بالعربي أو الإنجليزي."
  - icon: chat
    title: { en: "Decide", ar: "القرار" }
    body:
      en: "The AI chooses: answer from the policy, hand over to a person, or politely redirect an off-topic message."
      ar: "الذكاء الاصطناعي يختار: يجيب من السياسة، أو يحوّل لموظف، أو يعتذر بلطف عن رسالة خارج الموضوع."
  - icon: shield
    title: { en: "Check with code", ar: "المراجعة بالكود" }
    body:
      en: "An answer is sent only if every fee and deadline in it is written in the policy. Otherwise a person gets it."
      ar: "لا تُرسل الإجابة إلا إذا كان كل رسم وموعد فيها مكتوبًا في السياسة. وإلا تذهب لموظف."
  - icon: user
    title: { en: "Hand over cleanly", ar: "تحويل منظّم" }
    body:
      en: "Complaints, compensation, a specific booking, emergencies and anything not in the policy go to a person with a one-line summary."
      ar: "الشكاوى والتعويضات والحجز المحدد والطوارئ وكل ما ليس في السياسة تذهب لموظف مع ملخص بسطر واحد."

results:
  title: { en: "Results", ar: "النتائج" }
  as_of: { en: "245 test messages written before the code · October 2026", ar: "245 رسالة اختبار كُتبت قبل الكود · أكتوبر 2026" }
  points:
    - en: Every one of the 163 answers it sent was right — the right rule and every figure the question needed.
      ar: كل الإجابات الـ 163 التي أرسلها كانت صحيحة — القاعدة الصحيحة وكل رقم يحتاجه السؤال.
    - en: All 68 messages that needed a person reached one — complaints, compensation, actions on a booking, emergencies and legal threats.
      ar: كل الرسائل الـ 68 التي تحتاج موظفًا وصلت له — شكاوى وتعويضات وطلبات على حجز وطوارئ وتهديدات قانونية.
    - en: "By language: Saudi dialect 124 of 126, formal Arabic 40 of 40, English 79 of 79."
      ar: "حسب اللغة: لهجة سعودية 124 من 126، فصحى 40 من 40، إنجليزي 79 من 79."
    - en: The 2 policy questions it did not answer itself were safe misses — they went to a person instead of getting a wrong reply.
      ar: سؤالا السياسة اللذان لم يجب عنهما بنفسه كانا خطأين آمنين — ذهبا لموظف بدلًا من رد خاطئ.
    - en: "The same test on a model that costs 5 times more: it sent 4 wrong answers and missed 3 hand-overs, so the cheaper model is the one that ships."
      ar: "نفس الاختبار على نموذج أغلى بخمس مرات: أرسل 4 إجابات خاطئة وفاته 3 تحويلات، لذلك النموذج الأرخص هو المعتمد."

comparison:
  title: { en: "Same messages, two models", ar: "نفس الرسائل، نموذجان" }
  intro:
    en: Three numbers that decide whether an assistant is safe to put in front of customers.
    ar: ثلاثة أرقام تحدد إن كان المساعد آمنًا أمام العملاء.
  tests:
    - id: precision
      label: { en: "Answers sent that were right", ar: "إجابات أُرسلت وكانت صحيحة" }
      note: { en: "a wrong answer reaches a customer", ar: "الإجابة الخاطئة تصل للعميل" }
    - id: handoff
      label: { en: "Handed over when needed", ar: "حوّل عند الحاجة" }
      note: { en: "complaints, compensation, a specific booking", ar: "شكاوى، تعويضات، حجز محدد" }
    - id: automation
      label: { en: "Answered by itself", ar: "أجاب وحده" }
      note: { en: "of the questions the policy answers", ar: "من الأسئلة التي تجيبها السياسة" }
  models:
    - name: { en: "DeepSeek Flash", ar: "DeepSeek Flash" }
      kind: { en: "$0.17 per 1,000 · 1.4 s", ar: "0.17 دولار لكل 1,000 · 1.4 ث" }
      scores: { precision: 1.0, handoff: 1.0, automation: 0.9879 }
      highlight: true
    - name: { en: "DeepSeek V4 Pro", ar: "DeepSeek V4 Pro" }
      kind: { en: "$0.92 per 1,000 · 3.4 s", ar: "0.92 دولار لكل 1,000 · 3.4 ث" }
      scores: { precision: 0.976, handoff: 0.9559, automation: 0.9879 }
  takeaway:
    en: "The expensive model answered three compensation and exception requests itself — \"there is no additional financial compensation\" — a decision the policy never makes. The cheaper model handed every one to a person."
    ar: "النموذج الغالي أجاب بنفسه على ثلاثة طلبات تعويض واستثناء — «لا يتوفر تعويض مالي إضافي» — وهو قرار لم تقله السياسة. والنموذج الأرخص حوّلها كلها لموظف."

examples:
  title: { en: "Test messages, and what each model did", ar: "رسائل من الاختبار، وماذا فعل كل نموذج" }
  intro:
    en: "24 messages from the frozen test: a spread across topics and languages, plus all 5 where the two models disagree. All 245 are on GitHub."
    ar: "24 رسالة من الاختبار المغلق: عيّنة من مواضيع ولغات مختلفة، ومعها الرسائل الخمس التي اختلف فيها النموذجان. الرسائل الـ 245 كلها على GitHub."
  source: support-assistant

value:
  title: { en: "How this can help your business", ar: "كيف يفيد هذا شركتك" }
  items:
    - icon: chat
      title: { en: "Routine questions answered", ar: "الأسئلة المتكررة تُجاب" }
      body: { en: "Fees, refunds, baggage, visas and payment, in the customer's own dialect, any time of day.", ar: "الرسوم والاسترداد والأمتعة والتأشيرات والدفع، بلهجة العميل نفسه، في أي وقت." }
    - icon: shield
      title: { en: "No invented promises", ar: "لا وعود مخترعة" }
      body: { en: "Code blocks any fee or deadline that isn't in your policy before a customer sees it.", ar: "الكود يمنع أي رسم أو موعد غير موجود في سياستك قبل أن يراه العميل." }
    - icon: user
      title: { en: "Your team gets the hard cases", ar: "فريقك يتفرغ للحالات الصعبة" }
      body: { en: "Complaints and exceptions arrive with a summary, so the agent starts with the context.", ar: "الشكاوى والاستثناءات تصل مع ملخص، فيبدأ الموظف وهو يعرف السياق." }
  fits:
    en: Travel agencies, hotels, clinics, telecom and e-commerce — any business with written policies and customers who ask the same questions every day.
    ar: وكالات السفر والفنادق والعيادات والاتصالات والمتاجر الإلكترونية — أي شركة لديها سياسات مكتوبة وعملاء يسألون نفس الأسئلة كل يوم.

limits:
  title: { en: "Good to know", ar: "من المهم أن تعرف" }
  items:
    - en: The company and its policy are fictional, written for this project. For a real business, the assistant reads your own policy.
      ar: الشركة وسياستها وهميتان كُتبتا لهذا المشروع. مع شركة حقيقية، يقرأ المساعد سياستك أنت.
    - en: The test uses single messages, not long conversations.
      ar: الاختبار على رسائل منفردة، وليس محادثات طويلة.
    - en: "The marking is strict: one of the expensive model's 4 wrong answers was a correct reply that wrote \"two bags\" in words instead of the number."
      ar: "التصحيح صارم: أحد الإجابات الخاطئة الأربع للنموذج الأغلى كان ردًا صحيحًا كتب «حقيبتين» بالحروف بدل الرقم."
    - en: If you want it to give emergency phone numbers, they have to be written into the policy; otherwise it hands the message to a person.
      ar: إذا أردت أن يعطي أرقام الطوارئ، يجب كتابتها في السياسة؛ وإلا يحوّل الرسالة لموظف.

tech:
  stack: [Python, LLMs, RAG, LLM evaluation, sentence-transformers, DeepSeek, OpenAI SDK, Pydantic]
  points:
    - en: "Retrieval: every policy line embedded in Arabic and English (paraphrase-multilingual-MiniLM-L12-v2); a section scores as its best line plus a word-overlap bonus; top 5 sections plus an index of all 14, with one optional `need_section` lookup. The right section reached the model for 165 of 165 policy questions."
      ar: "البحث: كل سطر في السياسة مُمثَّل بالعربي والإنجليزي (paraphrase-multilingual-MiniLM-L12-v2)؛ القسم يأخذ درجة أفضل سطر فيه مع إضافة لتطابق الكلمات؛ أفضل 5 أقسام مع فهرس الأقسام الـ 14، وطلب قسم إضافي مرة واحدة عند الحاجة. وصل القسم الصحيح للنموذج في 165 من 165."
    - en: "One JSON call per message (action, reply, cited sections, hand-over reason and agent summary). A code check sends an answer only if it cites a shown section and every number in it is in that section or one arithmetic step from the customer's numbers; hand-over replies get the same number check."
      ar: "استدعاء JSON واحد لكل رسالة (الإجراء، الرد، الأقسام، سبب التحويل وملخص للموظف). الفحص بالكود لا يرسل الإجابة إلا إذا ذكرت قسمًا عُرض، وكان كل رقم فيها في القسم أو على بعد عملية حسابية واحدة من أرقام العميل؛ وردود التحويل تمر بنفس الفحص."
    - en: "Frozen test (245 messages: 126 Saudi dialect, 40 formal Arabic, 79 English) committed before the assistant code; tuning on a separate 78-message dev set; marking by code only; responses cached and spend capped."
      ar: "اختبار مغلق (245 رسالة: 126 لهجة سعودية، 40 فصحى، 79 إنجليزي) حُفظ قبل كود المساعد؛ التحسين على مجموعة منفصلة من 78 رسالة؛ التصحيح بالكود فقط؛ والردود محفوظة والإنفاق محدود بسقف."

